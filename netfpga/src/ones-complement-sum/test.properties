# Whole-32-byte-beat-only, no cross-beat accumulation - each beat's Internet checksum (RFC 1071) is
# computed independently, as if the beat's 32 bytes were a complete message: the ones'-complement of
# the ones'-complement sum of its 16 big-endian 16-bit words. Expected outputs computed with a
# straightforward Python RFC 1071 implementation, packed as this processor packs it: 60 zero hex
# chars followed by the 4-hex-char checksum.
# Vectors: the RFC 1071 section 3 worked example zero-padded to 32 bytes (checksum 220d), all zeros,
# all ones, a beat whose first carry fold itself carries (words ffff, ffff, 0001), two general beats,
# and a two-beat packet (expected output is both beats' checksums concatenated).
