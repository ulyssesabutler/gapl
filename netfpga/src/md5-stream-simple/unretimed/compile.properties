retime=false
# GAPL: 213.333ns is the MMCM's absolute floor for this board (VCO at its 600MHz minimum,
# CLKOUT0_DIVIDE_F at its 128 maximum) - unretimed MD5's single-cycle 64-round compression
# needs it, and nothing slower is achievable by a single MMCM stage anyway. ~5% timing margin,
# deliberately accepted - see the netfpga clock-period investigation for how this was derived
# and verified against real hardware.
clockPeriodNs=213.333
