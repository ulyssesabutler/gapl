retime=false
# GAPL: 213.333ns is the MMCM's absolute floor for this board (VCO at its 600MHz minimum,
# CLKOUT0_DIVIDE_F at its 128 maximum) - copied from md5's unretimed variation. Unretimed SHA-256's
# single-cycle 64-round compression is a longer path than MD5's, so it may not close timing even
# at this floor on real hardware; nothing slower is achievable by a single MMCM stage.
clockPeriodNs=213.333
