retime=false
# GAPL: 213.333ns is the MMCM's absolute floor for this board (VCO at its 600MHz minimum,
# CLKOUT0_DIVIDE_F at its 128 maximum) - copied from md5's unretimed variation as a conservative
# starting point. Unretimed SHA3-256's single-cycle 24-round Keccak-f[1600] has no adders and should
# be a much shallower path than MD5's, so this has not been tuned and can likely be tightened.
clockPeriodNs=213.333
