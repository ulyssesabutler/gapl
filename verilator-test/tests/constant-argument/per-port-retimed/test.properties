# The variation that matters. --flatten none forces the hierarchical path, so `accumulate` stays a
# real module boundary, and a clock period well below the chain's combinational delay forces
# retiming to put registers inside it - including on the constant path.
retime=true
flatten=false
constantSimplification=true
retimingSolver=per-port-hierarchical-minimal-register
retimingClockPeriod=5
